# HACE-VD with the CodeBERT backbone. Enables all three contributions:
#   1. HDBSCAN pseudo-domains (no convex assumption, automatic k)
#   2. Supervised-contrastive expert regularization
#   3. Multi-head attention fusion

seed: 8

backbone:
  name:        "microsoft/codebert-base"
  max_length:  512
  freeze:      true
  embedding_dim: 768

clustering:
  method:     "hdbscan"
  metric:     "cosine"
  k:          null
  min_cluster_size: 200
  min_samples: 50
  l2_normalize: true
  random_state: 42

soft_labels:
  type:        "softmax_neg_distance"
  temperature: 1.0

experts:
  hidden_dim:  768
  num_layers:  2
  dropout:     0.1
  activation:  "tanh"

domain_classifier:
  hidden_dim:  768
  dropout:     0.1

fusion:
  type:        "multihead_attention"
  num_heads:   4
  attention_dim: 128

loss:
  vuln_weight:         1.0
  domain_weight:       0.1
  contrastive_weight:  0.1
  contrastive_temperature: 0.07
  contrastive_type:    "supervised"

training:
  batch_size:       32
  learning_rate:    5.0e-4
  weight_decay:     1.0e-4
  num_epochs:       100
  early_stopping_patience: 10
  oversample_minority: true
  grad_clip:        1.0

paths:
  data_root:        "data/processed"
  embeddings_root:  "data/embeddings/codebert"
  pseudo_domains:   "data/pseudo_domains/hacevd_codebert.npz"
  output_dir:       "runs/hacevd_codebert"
