# Reproduces the CEVD baseline (Cao et al., Future Internet, 2026)
# with the CodeBERT backbone. All HACE-VD additions are disabled.

seed: 8

backbone:
  name:        "microsoft/codebert-base"
  max_length:  512
  freeze:      true
  embedding_dim: 768

clustering:
  method:     "kmeans"
  metric:     "cosine"
  k:          5                             # selected by elbow method in the paper
  min_cluster_size: null
  min_samples: null
  l2_normalize: true
  random_state: 42

soft_labels:
  type:        "softmax_neg_distance"
  temperature: 1.0

experts:
  hidden_dim:  768
  num_layers:  2
  dropout:     0.1
  activation:  "tanh"

domain_classifier:
  hidden_dim:  768
  dropout:     0.1

fusion:
  type:        "linear_softmax"             # CEVD's simple weighted sum
  num_heads:   null
  attention_dim: null

loss:
  vuln_weight:         1.0
  domain_weight:       0.1                  # CEVD's lambda
  contrastive_weight:  0.0                  # disabled
  contrastive_temperature: 0.07
  contrastive_type:    "supervised"

training:
  batch_size:       32
  learning_rate:    5.0e-4
  weight_decay:     1.0e-4
  num_epochs:       100
  early_stopping_patience: 10
  oversample_minority: true
  grad_clip:        1.0

paths:
  data_root:        "data/processed"
  embeddings_root:  "data/embeddings/codebert"
  pseudo_domains:   "data/pseudo_domains/cevd_codebert.npz"
  output_dir:       "runs/cevd_codebert"
